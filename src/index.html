<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
        }

        .header {
            background: white;
            padding: 16px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 12px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #f0f0f0;
            color: #333;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .header-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        .chat-box {
            width: 100%;
            max-width: 1200px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #ffffff;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            order: 2;
        }

        .ai .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 4px 12px 12px;
        }

        .ai .message-content {
            background: #f5f5f5;
            color: #333;
            border-radius: 4px 12px 12px 12px;
        }

        .message-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .type-ai {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .type-cmd {
            background: #fff3e0;
            color: #e65100;
        }

        .type-error {
            background: #ffebee;
            color: #c62828;
        }

        .input-area {
            padding: 16px;
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #input {
            flex: 1;
            border: none;
            padding: 12px 8px;
            font-size: 14px;
            background: transparent;
            outline: none;
            max-height: 100px;
            resize: none;
            font-family: inherit;
        }

        #input::placeholder {
            color: #999;
        }

        .send-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        /* 滚动条样式 - 更宽更明显 */
        .chat-messages::-webkit-scrollbar {
            width: 10px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f5f5f5;
            border-radius: 5px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            min-height: 40px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5568d3 0%, #64388a 100%);
            box-shadow: 0 0 6px rgba(102, 126, 234, 0.4);
        }

        /* Firefox 滚动条 */
        .chat-messages {
            scrollbar-width: auto;
            scrollbar-color: #667eea #f5f5f5;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
                gap: 8px;
            }

            .message-content {
                max-width: 85%;
            }

            .header {
                padding: 12px 16px;
            }

            .header-title {
                font-size: 20px;
            }

            .chat-box {
                height: 500px;
            }

            .chat-messages::-webkit-scrollbar {
                width: 8px;
            }

            .input-area {
                flex-wrap: wrap;
                gap: 8px;
            }

            .input-wrapper {
                flex: 0 0 100%;
            }

            .send-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">🚀 OpenClaw</div>
        <div class="header-actions">
            <button class="header-btn" onclick="resetChat()">新建对话</button>
            <button class="header-btn" onclick="clearSession()">清除历史</button>
        </div>
    </div>

    <div class="container">
        <div class="chat-box">
            <div class="chat-messages" id="chat"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="input" 
                        placeholder="你想做什么？" 
                        onkeypress="handleKeyPress(event)"
                    >
                </div>
                <button class="send-btn" id="sendBtn" onclick="send()">发送</button>
            </div>
        </div>
    </div>

    <script>
        let isLoading = false;

        async function send() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const sendBtn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            
            if (!msg || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;

            // 显示用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
                <div class="message-content">${escapeHtml(msg)}</div>
                <div class="message-avatar">我</div>
            `;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // 显示加载动画
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai';
            loadingMsg.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chat.appendChild(loadingMsg);
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const data = await res.json();
                chat.removeChild(loadingMsg);

                // 处理 steps 数组
                if (data.steps && Array.isArray(data.steps)) {
                    data.steps.forEach(step => {
                        const msgEl = document.createElement('div');
                        msgEl.className = 'message ai';
                        
                        if (step.type === 'ai') {
                            msgEl.innerHTML = `
                                <div class="message-avatar">AI</div>
                                <div class="message-content">
                                    <div class="message-type type-ai">AI 回复</div>
                                    ${escapeHtml(step.content)}
                                </div>
                            `;
                        } else if (step.type === 'cmd') {
                            msgEl.innerHTML = `
                                <div class="message-avatar">AI</div>
                                <div class="message-content">
                                    <div class="message-type type-cmd">命令执行</div>
                                    <code style="background: #f0f0f0; padding: 4px 8px; border-radius: 4px; display: block; overflow-x: auto; font-size: 12px; line-height: 1.4;">${escapeHtml(step.content)}</code>
                                </div>
                            `;
                        } else if (step.type === 'error') {
                            msgEl.innerHTML = `
                                <div class="message-avatar">AI</div>
                                <div class="message-content">
                                    <div class="message-type type-error">错误</div>
                                    ${escapeHtml(step.content)}
                                </div>
                            `;
                        }
                        chat.appendChild(msgEl);
                    });
                } else if (data.reply) {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'message ai';
                    msgEl.innerHTML = `
                        <div class="message-avatar">AI</div>
                        <div class="message-content">${escapeHtml(data.reply)}</div>
                    `;
                    chat.appendChild(msgEl);
                }
            } catch (e) {
                chat.removeChild(loadingMsg);
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai';
                errMsg.innerHTML = `
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-type type-error">错误</div>
                        无法连接到服务器，请检查网络连接
                    </div>
                `;
                chat.appendChild(errMsg);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                send();
            }
        }

        async function resetChat() {
            document.getElementById('chat').innerHTML = '';
            try {
                await fetch('/reset', { method: 'POST' });
            } catch (e) {
                console.error('重置失败:', e);
            }
        }

        async function clearSession() {
            if (confirm('确定要清除所有历史记录吗？')) {
                try {
                    await fetch('/clear-session', { method: 'POST' });
                    document.getElementById('chat').innerHTML = '';
                } catch (e) {
                    console.error('清除失败:', e);
                }
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // 页面加载完成后自动聚焦输入框
        window.addEventListener('load', () => {
            document.getElementById('input').focus();
        });
    </script>
</body>
</html>
